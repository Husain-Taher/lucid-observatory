version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucid-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FRED_API_KEY=${FRED_API_KEY:-demo}
      - CORS_ORIGINS=http://localhost:3000,https://lucid-observatory.vercel.app
    volumes:
      - lucid-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lucid-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lucid-data:
