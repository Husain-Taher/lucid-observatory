name: lucid-observatory
region: nyc
services:
  - name: lucid-api
    dockerfile_path: infra/docker/Dockerfile.backend
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /docs
      - path: /health
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
    envs:
      - key: PROJECT_NAME
        value: "Lucid"
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: FRED_API_KEY
        value: ${FRED_API_KEY}
      - key: GEMINI_API_KEY
        value: ${GEMINI_API_KEY}
